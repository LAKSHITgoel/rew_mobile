name: rew_mobile
description: Measure and tune car audio from your phone with a UMIK-1 mic.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0            # calloc/malloc helpers for dart:ffi
  rewcore_ffi:          # compiles + bundles the native rewcore library
    path: ../packages/rewcore_ffi

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  ffigen: ^11.0.0        # regenerate bindings from core/ffi/rewcore_ffi.h

flutter:
  uses-material-design: true

# ---------------------------------------------------------------------------
# NOTE: This directory holds the app's Dart source (lib/) and manifest only.
# The platform folders (android/, ios/, linux/, etc.) and the FFI/native
# wiring are generated by Flutter tooling and are intentionally not committed
# hand-written. To bootstrap on a machine with the Flutter SDK:
#
#   cd app
#   flutter create --platforms=android,ios,linux,macos,windows .
#   flutter pub get
#   flutter run              # runs against the mock audio backend by default
#
# Then follow app/README.md to attach the rewcore FFI plugin and the native
# audio plugins (android/native, ios/native).
# ---------------------------------------------------------------------------
