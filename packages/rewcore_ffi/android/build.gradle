// Android build for the rewcore_ffi plugin: compiles ../src/CMakeLists.txt (the
// rewcore core) into librewcore_ffi.so for each ABI. Mirrors what
// `flutter create --template=plugin_ffi` produces; adjust the namespace/versions to
// match your Flutter/AGP toolchain.
group 'com.rewmobile.rewcore_ffi'
version '0.1.0'

buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath 'com.android.tools.build:gradle:8.1.0' }
}

rootProject.allprojects {
    repositories { google(); mavenCentral() }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.rewmobile.rewcore_ffi'
    compileSdk 34

    defaultConfig {
        minSdk 21  // USB host + AudioRecord PCM_FLOAT
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
                cppFlags '-std=c++17'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path '../src/CMakeLists.txt'
        }
    }
}
